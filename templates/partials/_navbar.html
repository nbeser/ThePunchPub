{% load static %}

{% block css_files %}
    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">
{% endblock %}



<nav class="navbar navbar-expand-lg {% if products %}sticky-top {% else %}fixed-top {% endif %}" style="background-color: transparent">

  <div class="container-fluid">

    <a class="navbar-brand mt-2 mt-lg-0" href="/">
      <img src="{% static "/img/punchLogo.png" %}" height="30" alt="MDB Logo" loading="lazy"/>
    </a>
    <button class="navbar-toggler bg-warning" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
      <i class="fas fa-bars"></i>
    </button>


    <div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">The Punch Pub</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>

      <div class="offcanvas-body" style="color: white; text-shadow: 1px 1px 2px #000000;">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          <li class="nav-item">
            <a class="nav-link text-warning active" aria-current="page" href="{% url "pages_menu" %}">Menü</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-warning " href="#">Hakkımızda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-warning " href="#">Adres</a>
          </li>
        </ul>




        <ul class="navbar-nav me-0">
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a href="{% url "user_index" user.username|lower %}" class="nav-link text-white">Hoşgeldin, {{ user.username|title }}</a>
            </li>

            <li class="nav-item">
                <a href="{% url "user_logout" %}" class="nav-link text-white">Logout</a>
            </li>
            
          {% elif nav_request %}
            <li class="nav-item">
                <a href="{% url "user_login" %}" class="nav-link text-white">Login</a>
            </li>
            <li class="nav-item">
                <a href="{% url "user_register" %}" class="nav-link text-white">Register</a>
            </li>
            
          {% endif %}
        </ul>



      </div>


    </div>   
  </div>

</nav>
