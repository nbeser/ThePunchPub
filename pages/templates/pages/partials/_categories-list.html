<h6>Kategoriler</h6>
{% for category in beverages_categories %}
    <div class="card">
        <div class="card-body">
            <h6 class="card-title">{{ category.name }}</h6>
            <a href="{% url 'edit_beverageCategories' category.slug %}" class="card-link">Düzenle</a>
            <a href="{% url "delete_beverageCategories" category.slug %}" class="card-link">Sil</a>
        </div>
    </div>
{% endfor %}
